# Weekly checks for outdated or vulnerable dependencies. Each update arrives as a pull request
# that the tests run on; nothing is merged without review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Express 5 changes routing and error handling: a move to it is planned by hand, not merged from a bot.
    ignore:
      - dependency-name: express
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
