# Asks each new contributor to sign CLA.md once, by posting one sentence on their pull request.
# Signatures are stored in signatures/version1/cla.json on the branch below (created on the first
# signature; do not create it by hand). The bot adds ordinary commits there, so the branch may block
# force-pushes and deletion (the "Keep main's history" ruleset does), but must not require pull requests
# or status checks, or the bot cannot write.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: bot*
          custom-notsigned-prcomment: 'Thank you for your contribution. Before it can be merged, please read the [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md) and sign it by posting the comment below. You keep the copyright in your work, and the project promises it will always stay open source. You only need to do this once.'
