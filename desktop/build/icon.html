<!doctype html>
<!-- The source of icon.png: the \___/ mark, drawn in text like everything else in Kadhai.
     Remake it with headless Chrome or Edge (see desktop/README.md). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .tile {
    box-sizing: border-box; width: 512px; height: 512px; border-radius: 96px;
    background: #141414; border: 14px solid #3a3a3a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; color: #f2f2f2;
    font-variant-ligatures: none;
  }
  .steam { font-size: 84px; line-height: 0.9; color: #8a8a8a; white-space: pre; margin-bottom: 10px; }
  .pot { font-size: 118px; font-weight: 700; line-height: 1; white-space: pre; letter-spacing: -0.04em; }
</style>
</head>
<body>
  <div class="tile">
    <div class="steam">~ ~ ~</div>
    <div class="pot">\___/</div>
  </div>
</body>
</html>
